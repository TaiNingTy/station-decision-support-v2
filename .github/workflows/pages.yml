# Deploys the static site in docs/ to GitHub Pages through GitHub Actions.
# Pages source must be "GitHub Actions" (configure-pages enables it on first run).
name: Deploy docs to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["docs/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out docs only
        uses: actions/checkout@v4
        with:
          sparse-checkout: docs
          sparse-checkout-cone-mode: true
      - name: Configure Pages (enables the site if needed)
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload docs as the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
